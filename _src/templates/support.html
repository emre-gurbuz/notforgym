<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2542D">
  <link rel="icon" type="image/png" href="{{root}}assets/favicon.png">
  <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
  <link rel="stylesheet" href="{{root}}assets/style.css">
{{alternates}}
  <script src="{{root}}assets/site.js"></script>
  <title>{{title_support}}</title>
  <meta name="description" content="{{desc_support}}">
</head>
<body>
{{header}}
<main class="doc">
  <h1>{{support_h1}}</h1>
  <div class="card contact-card">
    <h3>{{contact_h3}}</h3>
    <p class="meta">{{contact_p}}</p>
    <p><a class="js-email" href="#">{{email_fallback}}</a></p>
    <a class="button js-mail-btn" href="#">{{email_btn}}</a>
  </div>
  <h2>{{faq_h2}}</h2>
{{faq}}
  <div class="note">{{health_note}}</div>
</main>
{{footer}}
</body>
</html>
